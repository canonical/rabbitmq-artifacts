listeners.tcp.default = 5672
management.tcp.port = 15672
# The guest user is limited to loopback connections by default.
loopback_users.guest = true
# Log to stdout so `snap logs rabbitmq` shows broker output; files go to $SNAP_COMMON/var/log/rabbitmq.
log.console = true
log.console.level = info
# No logrotate in the snap; rotate log files in the broker (10 MiB, 5 files).
log.file.rotation.size = 10485760
log.file.rotation.count = 5
